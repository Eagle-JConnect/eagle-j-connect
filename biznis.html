<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eagle-J Connect — Biznis ak Sèvis</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <!-- LOGO -->
    <div class="logo-area">
      <a href="index.html">
        <img src="Logo.jpg" alt="Eagle-J Connect">
      </a>

      <div class="site-title">
        <strong>Eagle-J Connect</strong>
        <span>Ayiti + Bahamas</span>
      </div>
    </div>


    <!-- MENU BUTTON -->
    <button
      id="menuToggle"
      class="menu-toggle"
      type="button"
      aria-label="Ouvri meni"
      aria-expanded="false"
    >
      ☰
    </button>


    <!-- NAVIGATION -->
    <nav id="menu">

      <a id="nav-home" href="index.html">
        Akèy
      </a>

      <a id="nav-jobs" href="travay.html">
        Travay
      </a>

      <a id="nav-business" href="biznis.html">
        Biznis
      </a>

      <a id="nav-contact" href="kontak.html">
        Kontak
      </a>

      <a id="nav-register" href="enskri.html">
        Enskri
      </a>

      <div class="language">
        <select id="languageSelect" onchange="changeLanguage()">
          <option value="ht">🇭🇹 Kreyòl</option>
          <option value="en">🇺🇸 English</option>
          <option value="fr">🇫🇷 Français</option>
        </select>
      </div>

    </nav>

  </header>


  <!-- MAIN -->
  <main class="page-container">

    <section class="page-hero">

      <h1 id="businessTitle">
        Biznis ak Sèvis
      </h1>

      <p id="businessSubtitle">
        Dekouvri biznis ak sèvis ki disponib nan kominote Ayiti ak Bahamas.
      </p>

    </section>


    <!-- SEARCH -->
    <section class="search-section">

      <input
        type="text"
        id="businessSearch"
        placeholder="Chèche yon biznis oswa sèvis..."
      >

    </section>


    <!-- BUSINESS LIST -->
    <section>

      <div
        id="businessList"
        class="business-grid"
      >

        <p>
          Ap chèche biznis yo...
        </p>

      </div>

    </section>

  </main>


  <!-- MENU SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const button = document.getElementById("menuToggle");
      const menu = document.getElementById("menu");

      if (!button || !menu) {
        console.error("Bouton meni oswa meni pa jwenn.");
        return;
      }

      button.addEventListener("click", function (event) {

        event.preventDefault();
        event.stopPropagation();

        menu.classList.toggle("show");

        const opened = menu.classList.contains("show");

        button.setAttribute(
          "aria-expanded",
          opened ? "true" : "false"
        );

      });


      /* Fè meni an fèmen lè yon moun klike sou yon lyen */
      menu.querySelectorAll("a").forEach(function (link) {

        link.addEventListener("click", function () {

          menu.classList.remove("show");

          button.setAttribute(
            "aria-expanded",
            "false"
          );

        });

      });


      /* Fè meni an fèmen si moun klike deyò meni an */
      document.addEventListener("click", function (event) {

        if (
          !menu.contains(event.target) &&
          !button.contains(event.target)
        ) {

          menu.classList.remove("show");

          button.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      });

    });
  </script>


  <!-- LANGUAGE -->
  <script src="language.js"></script>

  <!-- MAIN JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
