<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eagle-J Connect — Biznis</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8fc;
    }

    header {
      height: 74px;
      background: #003366;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      position: relative;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-area img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
    }

    .site-title {
      color: white;
      display: flex;
      flex-direction: column;
    }

    .site-title strong {
      font-size: 18px;
    }

    .site-title span {
      font-size: 12px;
    }

    /* BOUTON MENI */
    #menuToggle {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 50px;
      height: 50px;

      border: 2px solid white;
      border-radius: 8px;

      background: #003366;
      color: white;

      font-size: 28px;
      line-height: 1;

      cursor: pointer;

      position: relative;
      z-index: 99999;
    }

    /* MENI */
    #menu {
      display: none;

      position: absolute;
      top: 74px;
      right: 0;

      width: 270px;

      background: #003366;

      padding: 15px;

      z-index: 99998;

      flex-direction: column;
      gap: 5px;

      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    #menu.show {
      display: flex;
    }

    #menu a {
      display: block;

      color: white;
      text-decoration: none;

      padding: 14px;

      font-size: 17px;

      border-radius: 6px;
    }

    #menu a:hover {
      background: #F4B400;
      color: #003366;
    }

    .language select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }

    main {
      padding: 30px 15px;
    }

    .hero {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      max-width: 900px;
      margin: auto;
    }

    .hero h1 {
      color: #003366;
    }

    .hero p {
      color: #555;
    }

    #businessList {
      max-width: 900px;
      margin: 25px auto;
    }

    .message {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>


<body>

  <!-- HEADER -->
  <header>

    <div class="logo-area">

      <a href="index.html">
        <img src="Logo.jpg" alt="Eagle-J Connect">
      </a>

      <div class="site-title">
        <strong>Eagle-J Connect</strong>
        <span>Ayiti + Bahamas</span>
      </div>

    </div>


    <!-- BOUTON ☰ -->
    <button id="menuToggle" type="button">
      ☰
    </button>


    <!-- MENI -->
    <nav id="menu">

      <a href="index.html">
        Akèy
      </a>

      <a href="travay.html">
        Travay
      </a>

      <a href="biznis.html">
        Biznis
      </a>

      <a href="kontak.html">
        Kontak
      </a>

      <a href="enskri.html">
        Enskri
      </a>

      <div class="language">

        <select id="languageSelect">
          <option value="ht">🇭🇹 Kreyòl</option>
          <option value="en">🇺🇸 English</option>
          <option value="fr">🇫🇷 Français</option>
        </select>

      </div>

    </nav>

  </header>


  <!-- KONTNI -->
  <main>

    <section class="hero">

      <h1>
        Biznis ak Sèvis
      </h1>

      <p>
        Dekouvri biznis ak sèvis ki disponib nan kominote
        Ayiti ak Bahamas.
      </p>

    </section>


    <section id="businessList">

      <div class="message">
        Biznis yo ap parèt isit la.
      </div>

    </section>

  </main>


  <!-- MENU JAVASCRIPT -->
  <script>

    const menuButton = document.getElementById("menuToggle");
    const menu = document.getElementById("menu");


    menuButton.addEventListener("click", function () {

      if (menu.style.display === "flex") {

        menu.style.display = "none";

      } else {

        menu.style.display = "flex";

      }

    });


    document.addEventListener("click", function(event) {

      if (
        !menu.contains(event.target) &&
        !menuButton.contains(event.target)
      ) {

        menu.style.display = "none";

      }

    });

  </script>

</body>
</html>
