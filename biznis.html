<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eagle-J Connect — Biznis</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8fc;
    }

    /* HEADER */
    header {
      height: 74px;
      background: #003366;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      position: relative;
      z-index: 10000;
    }

    /* LOGO */
    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-area a {
      display: flex;
      align-items: center;
    }

    .logo-area img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
    }

    .site-title {
      color: white;
      display: flex;
      flex-direction: column;
    }

    .site-title strong {
      font-size: 18px;
    }

    .site-title span {
      font-size: 12px;
    }

    /* =========================
       MENU SYSTEM
       PA GEN JAVASCRIPT
       ========================= */

    /* Kache checkbox la */
    #menuCheck {
      display: none;
    }

    /* Bouton ☰ */
    .menu-button {
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #003366;
      color: white;

      border: 2px solid white;
      border-radius: 8px;

      font-size: 28px;
      font-weight: bold;

      cursor: pointer;

      user-select: none;

      position: relative;
      z-index: 10002;
    }

    /* MENI FÈMEN */
    #menu {
      display: none;

      position: absolute;

      top: 74px;
      right: 0;

      width: 270px;
      max-width: 90vw;

      background: #003366;

      padding: 15px;

      flex-direction: column;
      gap: 5px;

      border-radius: 0 0 0 12px;

      box-shadow: 0 8px 20px rgba(0,0,0,0.30);

      z-index: 10001;
    }

    /* MENI LOUVRI */
    #menuCheck:checked ~ #menu {
      display: flex;
    }

    /* LYEN MENI */
    #menu a {
      display: block;

      width: 100%;

      color: white;
      text-decoration: none;

      padding: 14px;

      font-size: 17px;

      border-radius: 6px;
    }

    #menu a:hover {
      background: #F4B400;
      color: #003366;
    }

    /* LANGUAGE */
    .language {
      width: 100%;
    }

    .language select {
      width: 100%;
      padding: 10px;

      border: none;
      border-radius: 6px;

      font-size: 15px;
    }

    /* KONTNI */
    main {
      padding: 30px 15px;
    }

    .hero {
      background: white;

      padding: 25px;

      border-radius: 12px;

      text-align: center;

      max-width: 900px;

      margin: auto;
    }

    .hero h1 {
      color: #003366;
      margin-top: 0;
    }

    .hero p {
      color: #555;
      line-height: 1.6;
    }

    #businessList {
      max-width: 900px;
      margin: 25px auto;
    }

    .message {
      background: white;

      padding: 25px;

      border-radius: 12px;

      text-align: center;
    }

    /* DESKTOP */
    @media (min-width: 769px) {

      .menu-button {
        display: none;
      }

      #menu {
        display: flex;
        position: static;

        width: auto;

        flex-direction: row;
        align-items: center;

        padding: 0;

        background: transparent;

        box-shadow: none;

        border-radius: 0;
      }

      #menu a {
        width: auto;
        padding: 10px 12px;
      }

      .language {
        width: auto;
      }

      .language select {
        width: auto;
      }

    }

    /* MOBILE */
    @media (max-width: 768px) {

      .menu-button {
        display: flex;
      }

    }

  </style>
</head>


<body>

  <!-- HEADER -->
  <header>

    <!-- LOGO -->
    <div class="logo-area">

      <a href="index.html">
        <img src="Logo.jpg" alt="Eagle-J Connect">
      </a>

      <div class="site-title">
        <strong>Eagle-J Connect</strong>
        <span>Ayiti + Bahamas</span>
      </div>

    </div>


    <!-- CHECKBOX KACHE -->
    <input
      type="checkbox"
      id="menuCheck"
    >


    <!-- BOUTON MENI -->
    <label
      for="menuCheck"
      class="menu-button"
      aria-label="Ouvri meni"
    >
      ☰
    </label>


    <!-- MENU -->
    <nav id="menu">

      <a href="index.html">
        Akèy
      </a>

      <a href="travay.html">
        Travay
      </a>

      <a href="biznis.html">
        Biznis
      </a>

      <a href="kontak.html">
        Kontak
      </a>

      <a href="enskri.html">
        Enskri
      </a>

      <div class="language">

        <select id="languageSelect">

          <option value="ht">
            🇭🇹 Kreyòl
          </option>

          <option value="en">
            🇺🇸 English
          </option>

          <option value="fr">
            🇫🇷 Français
          </option>

        </select>

      </div>

    </nav>

  </header>


  <!-- KONTNI -->
  <main>

    <section class="hero">

      <h1>
        Biznis ak Sèvis
      </h1>

      <p>
        Dekouvri biznis ak sèvis ki disponib nan kominote
        Ayiti ak Bahamas.
      </p>

    </section>


    <section id="businessList">

      <div class="message">
        Biznis yo ap parèt isit la.
      </div>

    </section>

  </main>


</body>
</html>
