<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enskri | Eagle-J Connect</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="brand">

        <div class="logo-area">

            <img
                src="Logo.jpg"
                alt="Eagle-J Connect Logo"
            >

            <h2>
                Eagle-J Connect
            </h2>

            <span>
                Ayiti + Bahamas
            </span>

        </div>

    </div>


    <!-- MOBILE MENU BUTTON -->

    <button
        type="button"
        class="menu-toggle"
        onclick="toggleMenu()"
        aria-label="Louvri meni"
    >
        ☰
    </button>


    <!-- NAVIGATION -->

    <nav id="menu">

        <a href="index.html">
            Akèy
        </a>

        <a href="travay.html">
            Travay
        </a>

        <a href="biznis.html">
            Biznis
        </a>

        <a href="kontak.html">
            Kontak
        </a>

        <a href="enskri.html">
            Enskri
        </a>

        <a href="login.html">
            Konekte
        </a>

    </nav>

</header>



<!-- =========================
     REGISTER
========================= -->

<section class="services">

    <h1>
        Kreye Kont Ou
    </h1>


    <p>
        Kreye yon kont pou jwenn travay,
        poste travay oswa devlope biznis ou.
    </p>


    <!-- MESSAGE -->

    <p
        id="registerMessage"
        style="
            text-align:center;
            font-weight:bold;
            margin:15px 0;
        "
    ></p>


    <!-- REGISTER FORM -->

    <form
        id="registerForm"
        class="business-form"
    >


        <!-- FULL NAME -->

        <input
            type="text"
            id="fullName"
            placeholder="Non konplè"
            autocomplete="name"
            required
        >


        <!-- EMAIL -->

        <input
            type="email"
            id="email"
            placeholder="Imèl"
            autocomplete="email"
            required
        >


        <!-- PHONE -->

        <input
            type="tel"
            id="phone"
            placeholder="Telefòn oswa WhatsApp"
            autocomplete="tel"
            required
        >


        <!-- ACCOUNT TYPE -->

        <select
            id="accountType"
            required
        >

            <option
                value=""
            >
                Chwazi kalite kont
            </option>

            <option
                value="job_seeker"
            >
                👤 Moun k ap chèche travay
            </option>

            <option
                value="employer"
            >
                🏢 Anplwayè
            </option>

        </select>


        <!-- PASSWORD -->

        <input
            type="password"
            id="password"
            placeholder="Modpas"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <!-- CONFIRM PASSWORD -->

        <input
            type="password"
            id="confirmPassword"
            placeholder="Konfime modpas"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <!-- SUBMIT -->

        <button
            type="submit"
        >
            🚀 Kreye Kont
        </button>


    </form>


    <!-- LOGIN LINK -->

    <p
        style="
            text-align:center;
            margin-top:20px;
        "
    >

        Ou deja gen yon kont?

        <a
            href="login.html"
        >
            Konekte
        </a>

    </p>


</section>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <h3>
        Eagle-J Connect
    </h3>


    <p>
        Konekte Opòtinite ant Ayiti ak Bahamas.
    </p>


    <p>
        © 2026 Eagle-J Connect Bahamas + Ayiti
    </p>

</footer>



<!-- =========================
     JAVASCRIPT
========================= -->

<script src="script.js"></script>


</body>

</html>
