<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Konekte | Eagle-J Connect</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="brand">

        <div class="logo-area">

            <img
                src="Logo.jpg"
                alt="Eagle-J Connect Logo"
            >

            <h2>
                Eagle-J Connect
            </h2>

            <span>
                Ayiti + Bahamas
            </span>

        </div>

    </div>


    <button
        type="button"
        class="menu-toggle"
        onclick="toggleMenu()"
        aria-label="Louvri meni"
    >
        ☰
    </button>


    <nav id="menu">

        <a href="index.html">
            Akèy
        </a>

        <a href="travay.html">
            Travay
        </a>

        <a href="biznis.html">
            Biznis
        </a>

        <a href="kontak.html">
            Kontak
        </a>

        <a href="enskri.html">
            Enskri
        </a>

    </nav>

</header>



<!-- =========================
     LOGIN
========================= -->

<section class="services">

    <h1>
        Konekte sou kont ou
    </h1>


    <p>
        Antre email ak modpas ou pou kontinye.
    </p>


    <p
        id="loginMessage"
        style="
            text-align:center;
            font-weight:bold;
            margin:15px 0;
        "
    ></p>


    <form
        id="loginForm"
        class="business-form"
    >

        <input
            type="email"
            id="loginEmail"
            placeholder="Imèl"
            autocomplete="email"
            required
        >


        <input
            type="password"
            id="loginPassword"
            placeholder="Modpas"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
        >
            🔐 Konekte
        </button>

    </form>


    <p
        style="
            text-align:center;
            margin-top:20px;
        "
    >

        Ou poko gen kont?

        <a href="enskri.html">
            Kreye yon kont
        </a>

    </p>

</section>



<footer>

    <h3>
        Eagle-J Connect
    </h3>

    <p>
        Konekte Opòtinite ant Ayiti ak Bahamas.
    </p>

    <p>
        © 2026 Eagle-J Connect
    </p>

</footer>



<script src="script.js"></script>

</body>
