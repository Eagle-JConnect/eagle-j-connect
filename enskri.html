<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enskri | Eagle-J Connect</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="brand">

        <div class="logo-area">

            <img
                src="Logo.jpg"
                alt="Eagle-J Connect Logo"
            >

            <h2>
                Eagle-J Connect
            </h2>

            <span>
                Ayiti + Bahamas
            </span>

        </div>

    </div>


    <!-- MOBILE MENU BUTTON -->

    <button
        type="button"
        class="menu-toggle"
        onclick="toggleMenu()"
        aria-label="Louvri meni"
    >
        ☰
    </button>


    <!-- NAVIGATION MENU -->

    <nav id="menu">

        <a href="index.html">
            Akèy
        </a>

        <a href="travay.html">
            Travay
        </a>

        <a href="biznis.html">
            Biznis
        </a>

        <a href="kontak.html">
            Kontak
        </a>

        <a href="enskri.html">
            Enskri
        </a>

        <a href="login.html">
            Konekte
        </a>

    </nav>

</header>



<!-- =========================
     REGISTER SECTION
========================= -->

<section class="services">

    <h1>
        Kreye Kont Ou
    </h1>


    <p>
        Kreye kont ou sou Eagle-J Connect
        pou jwenn oswa poste opòtinite travay.
    </p>


    <!-- REGISTER FORM -->

    <form
        id="registerForm"
        class="business-form"
    >


        <!-- FULL NAME -->

        <input
            type="text"
            id="fullName"
            placeholder="Non konplè"
            required
        >


        <!-- EMAIL -->

        <input
            type="email"
            id="email"
            placeholder="Imèl"
            required
        >


        <!-- PHONE -->

        <input
            type="tel"
            id="phone"
            placeholder="Telefòn oswa WhatsApp"
            required
        >


        <!-- ACCOUNT TYPE -->

        <select
            id="accountType"
            required
        >

            <option value="">
                Chwazi kalite kont
            </option>

            <option value="job_seeker">
                👤 Moun k ap chèche travay
            </option>

            <option value="employer">
                🏢 Anplwayè / Biznis
            </option>

        </select>


        <!-- PASSWORD -->

        <input
            type="password"
            id="password"
            placeholder="Modpas"
            minlength="6"
            required
        >


        <!-- CONFIRM PASSWORD -->

        <input
            type="password"
            id="confirmPassword"
            placeholder="Konfime modpas"
            minlength="6"
            required
        >


        <!-- REGISTER MESSAGE -->

        <div
            id="registerMessage"
            style="
                margin:15px 0;
                text-align:center;
                font-weight:bold;
            "
        ></div>


        <!-- SUBMIT -->

        <button
            type="submit"
        >
            Kreye Kont
        </button>


    </form>

</section>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 Eagle-J Connect Bahamas + Ayiti
    </p>

</footer>



<!-- =========================
     SCRIPT
========================= -->

<script src="script.js"></script>


</body>

</html>
