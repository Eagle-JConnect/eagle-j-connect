========================= --><script src="script.js"></script><script>

/* ======================================
   EAGLE-J CONNECT LOGIN
====================================== */

const SUPABASE_URL =
    "https://glwyqrvufmjscjbbszzz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_BW1Y0QkG-tCV0TiQnto4IA_H32L2esr";


const loginForm =
    document.getElementById("loginForm");


if (loginForm) {

    loginForm.addEventListener(
        "submit",
        loginUser
    );

}


/* ======================================
   LOGIN USER
====================================== */

async function loginUser(event) {

    event.preventDefault();


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    message.textContent =
        "⏳ Nap konekte...";

    message.style.color =
        "#003366";


    try {

        const response =
            await fetch(
                `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                }
            );


        const data =
            await response.json();


        /* ======================================
           LOGIN ERROR
        ====================================== */

        if (!response.ok) {

            console.error(
                "LOGIN ERROR:",
                data
            );


            let errorMessage =
                "Email oswa modpas la pa kòrèk.";


            if (
                data.error_description
            ) {

                errorMessage =
                    data.error_description;

            }
            else if (
                data.msg
            ) {

                errorMessage =
                    data.msg;

            }
            else if (
                data.message
            ) {

                errorMessage =
                    data.message;

            }


            message.textContent =
                "❌ " +
                errorMessage;

            message.style.color =
                "red";

            return;

        }


        /* ======================================
           SAVE LOGIN SESSION
        ====================================== */

        localStorage.setItem(
            "supabase_access_token",
            data.access_token
        );


        localStorage.setItem(
            "supabase_refresh_token",
            data.refresh_token
        );


        localStorage.setItem(
            "supabase_user_id",
            data.user.id
        );


        localStorage.setItem(
            "supabase_user_email",
            data.user.email
        );


        /* ======================================
           GET USER PROFILE
        ====================================== */

        const profileResponse =
            await fetch(
                `${SUPABASE_URL}/rest/v1/profiles?id=eq.${data.user.id}&select=*`,
                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${data.access_token}`

                    }

                }
            );


        const profiles =
            await profileResponse.json();


        /* ======================================
           CHECK PROFILE
        ====================================== */

        if (
            !profileResponse.ok
        ) {

            console.error(
                "PROFILE LOGIN ERROR:",
                profiles
            );

            message.textContent =
                "⚠️ Kont lan konekte, men nou pa kapab jwenn pwofil ou.";

            message.style.color =
                "orange";

            return;

        }


        if (
            !profiles ||
            profiles.length === 0
        ) {

            message.textContent =
                "⚠️ Kont lan konekte, men pwofil la pa jwenn.";

            message.style.color =
                "orange";

            return;

        }


        const profile =
            profiles[0];


        /* ======================================
           SAVE PROFILE INFORMATION
        ====================================== */

        localStorage.setItem(
            "user_full_name",
            profile.full_name || ""
        );


        localStorage.setItem(
            "user_phone",
            profile.phone || ""
        );


        localStorage.setItem(
            "user_account_type",
            profile.account_type || ""
        );


        /* ======================================
           SUCCESS
        ====================================== */

        message.textContent =
            "✅ Ou konekte avèk siksè!";

        message.style.color =
            "green";


        /* ======================================
           REDIRECT
        ====================================== */

        setTimeout(
            function () {

                if (
                    profile.account_type ===
                    "employer"
                ) {

                    window.location.href =
                        "employer.html";

                }
                else if (
                    profile.account_type ===
                    "job_seeker"
                ) {

                    window.location.href =
                        "job-seeker.html";

                }
                else {

                    window.location.href =
                        "index.html";

                }

            },
            1000
        );

    }


    catch (error) {

        console.error(
            "LOGIN SYSTEM ERROR:",
            error
        );


        message.textContent =
            "❌ Gen yon pwoblèm koneksyon. Eseye ankò.";

        message.style.color =
            "red";

    }

}

</script></body></html>
