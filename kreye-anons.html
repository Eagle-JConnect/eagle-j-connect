<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eagle-J Connect | Kreye Anons</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="brand">

        <div class="logo-area">

            <img src="Logo.jpg" alt="Eagle-J Connect Logo">

            <h2>Eagle-J Connect</h2>

            <span>Ayiti + Bahamas</span>

        </div>

    </div>


    <nav id="menu">

        <a href="index.html">Akèy</a>

        <a href="travay.html">Travay</a>

        <a href="biznis.html">Biznis</a>

        <a href="kontak.html">Kontak</a>

    </nav>

</header>



<!-- =========================
     CREATE BUSINESS AD
========================= -->

<section class="create-ad">

    <div class="create-ad-container">

        <h1>Kreye yon Anons Biznis</h1>

        <p class="create-ad-intro">

            Fè plis moun konnen biznis ou,
            pwodwi ou oswa sèvis ou yo.

        </p>


        <form id="businessForm" class="business-form">


            <!-- NON BIZNIS -->

            <label for="businessName">
                Non biznis la
            </label>

            <input
                type="text"
                id="businessName"
                name="businessName"
                placeholder="Egzanp: Eagle-J Beauty Shop"
                required
            >



            <!-- KATEGORI -->

            <label for="category">
                Kategori biznis
            </label>

            <select id="category" name="category" required>

                <option value="">
                    Chwazi yon kategori
                </option>

                <option value="restaurant">
                    🍽 Restoran
                </option>

                <option value="commerce">
                    🛒 Komès
                </option>

                <option value="service">
                    🔧 Sèvis
                </option>

                <option value="beauty">
                    🛍 Beauty / Bote
                </option>

                <option value="food">
                    🍔 Manje
                </option>

                <option value="digital">
                    💻 Digital Services
                </option>

                <option value="other">
                    📦 Lòt
                </option>

            </select>



            <!-- LOKALIZASYON -->

            <label for="location">
                Lokalizasyon
            </label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Egzanp: Nassau, Bahamas"
                required
            >



            <!-- TELEFÒN -->

            <label for="phone">
                Telefòn
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Egzanp: +1 242 000 0000"
            >



            <!-- WHATSAPP -->

            <label for="whatsapp">
                WhatsApp
            </label>

            <input
                type="tel"
                id="whatsapp"
                name="whatsapp"
                placeholder="Egzanp: +1 242 000 0000"
            >



            <!-- PRI -->

            <label for="price">
                Pri / Tarif
            </label>

            <input
                type="text"
                id="price"
                name="price"
                placeholder="Egzanp: $50 oswa Apati $25"
            >



            <!-- DESKRIPSYON -->

            <label for="description">
                Dekri biznis ou oswa sèvis ou
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Ekri kèk detay sou sa biznis ou ofri..."
                required
            ></textarea>



            <!-- FOTO -->

            <label for="businessImage">
                Foto biznis / pwodwi
            </label>

            <input
    type="file"
    id="businessImages"
    name="businessImages"
    accept="image/*"
    multiple
>
<small style="color:#666;">
    Ou ka chwazi jiska 5 foto.
</small>


            <!-- BOUTON -->

            <button type="submit">

                📢 Pibliye Anons

            </button>


        </form>


        <!-- MESAJ -->

        <div id="formMessage" class="form-message"></div>


    </div>

</section>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 Eagle-J Connect Bahamas + Ayiti
    </p>

</footer>


<script src="language.js"></script>

<script src="script.js"></script>


</body>

</html>
