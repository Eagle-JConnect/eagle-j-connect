<!DOCTYPE html><html lang="ht"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Eagle-J Connect | Kreye Anons</title>

<link rel="stylesheet" href="style.css">

</head><body><!-- =========================
     HEADER
========================= --><header class="header"><div class="brand">

    <div class="logo-area">

        <img

            alt="Eagle-J Connect Logo"
        >

        <h2>Eagle-J Connect</h2>

        <span>
            Ayiti + Bahamas
        </span>

    </div>

</div>


<div
    class="menu-icon"
    onclick="toggleMenu()"
>
    ☰
</div>


<nav id="menu">

    <a href="index.html">

</header><!-- =========================
     CREATE BUSINESS AD
========================= --><section class="create-ad"><div class="create-ad-container">

    <h1>
        Kreye yon Anons Biznis
    </h1>


    <p class="create-ad-intro">

        Fè plis moun konnen biznis ou,
        pwodwi ou oswa sèvis ou yo.

    </p>



    <form
        id="businessForm"
        class="business-form"
    >


        <!-- NON BIZNIS -->

        <label for="businessName">
            Non biznis la
        </label>

        <input
            type="text"
            id="businessName"
            name="businessName"
            placeholder="Egzanp: Eagle-J Beauty Shop"
            required
        >



        <!-- KATEGORI -->

        <label for="category">
            Kategori biznis
        </label>

        <select
            id="category"
            name="category"
            required
        >

            <option value="">
                Chwazi yon kategori
            </option>

            <option value="restaurant">
                🍽 Restoran
            </option>

            <option value="commerce">
                🛒 Komès
            </option>

            <option value="service">
                🔧 Sèvis
            </option>

            <option value="beauty">
                🛍 Beauty / Bote
            </option>

            <option value="food">
                🍔 Manje
            </option>

            <option value="digital">
                💻 Digital Services
            </option>

            <option value="other">
                📦 Lòt
            </option>

        </select>



        <!-- LOKALIZASYON -->

        <label for="location">
            Lokalizasyon
        </label>

        <input
            type="text"
            id="location"
            name="location"
            placeholder="Egzanp: Nassau, Bahamas"
            required
        >



        <!-- TELEFÒN -->

        <label for="phone">
            Telefòn
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Egzanp: +1 242 000 0000"
        >



        <!-- WHATSAPP -->

        <label for="whatsapp">
            WhatsApp
        </label>

        <input
            type="tel"
            id="whatsapp"
            name="whatsapp"
            placeholder="Egzanp: +1 242 000 0000"
        >



        <!-- PRI -->

        <label for="price">
            Pri / Tarif
        </label>

        <input
            type="text"
            id="price"
            name="price"
            placeholder="Egzanp: $50 oswa Apati $25"
        >



        <!-- DESKRIPSYON -->

        <label for="description">
            Dekri biznis ou oswa sèvis ou
        </label>

        <textarea
            id="description"
            name="description"
            placeholder="Ekri kèk detay sou sa biznis ou ofri..."
            required
        ></textarea>



        <!-- =========================
             FOTO
        ========================= -->

        <label for="businessImages">
            📸 Foto biznis / pwodwi
        </label>


        <input
            type="file"
            id="businessImages"
            name="businessImages"
            accept="image/jpeg,image/png,image/webp,image/gif"
            multiple
            onchange="limitBusinessImages(this)"
        >


        <small style="
            display:block;
            color:#666;
            margin-top:-10px;
        ">

            Ou ka chwazi jiska
            <strong>5 foto</strong>.

        </small>


        <p
            id="imageMessage"
            style="
                margin-top:8px;
                font-weight:bold;
            "
        ></p>



        <!-- =========================
             PREVIEW FOTO
        ========================= -->

        <div
            id="imagePreview"
            style="
                display:flex;
                flex-wrap:wrap;
                gap:10px;
                margin-top:10px;
            "
        ></div>



        <!-- =========================
             BOUTON
        ========================= -->

        <button
            type="submit"
        >

            📢 Pibliye Anons

        </button>


    </form>



    <!-- MESAJ -->

    <div
        id="formMessage"
        class="form-message"
    ></div>


</div>

</section><!-- =========================
     FOOTER
========================= --><footer><p>
    © 2026 Eagle-J Connect Bahamas + Ayiti
</p>

</footer><!-- =========================
     SCRIPTS
========================= --><script src="language.js"></script><script src="script.js"></script><!-- =========================
     IMAGE PREVIEW
========================= --><script>

function previewBusinessImages(input) {

    const preview =
        document.getElementById(
            "imagePreview"
        );

    if (!preview) return;

    preview.innerHTML = "";

    const files =
        Array.from(input.files);

    files.forEach(function(file) {

        const reader =
            new FileReader();

        reader.onload =
            function(event) {

                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    event.target.result;

                img.style.width =
                    "90px";

                img.style.height =
                    "90px";

                img.style.objectFit =
                    "cover";

                img.style.borderRadius =
                    "10px";

                img.style.border =
                    "2px solid #F4B400";

                preview.appendChild(
                    img
                );

            };

        reader.readAsDataURL(file);

    });

}



const businessImageInput =
    document.getElementById(
        "businessImages"
    );


if (businessImageInput) {

    businessImageInput.addEventListener(
        "change",
        function() {

            previewBusinessImages(
                this
            );

        }
    );

}

</script></body></html>
